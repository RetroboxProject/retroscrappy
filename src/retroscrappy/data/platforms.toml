# Bundled platform table.
#
# Keys are the system folder names used by Batocera / RetroBat / Retrobox
# under roms/. Users can add or override entries in
# ~/.config/retroscrappy/platforms.toml with the same format.
#
#   name          Display name
#   extensions    ROM extensions (lower case, with dot). Folders whose name
#                 ends in one of them (e.g. "Game.ps3") count as ROMs too.
#   screenscraper ScreenScraper "systemeid" (omit if unknown)
#   igdb          IGDB platform ids (omit if unknown)
#   aliases       Other folder names that mean the same platform
#   pc            true for PC launcher collections: uses the "pc" source
#                 priority profile (SteamGridDB first) instead of "console"

[platforms.nes]
name = "Nintendo Entertainment System"
extensions = [".nes", ".unf", ".unif", ".zip", ".7z"]
screenscraper = 3
igdb = [18, 99]
aliases = ["famicom"]

