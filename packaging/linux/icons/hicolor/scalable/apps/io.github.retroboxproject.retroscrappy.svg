<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1150"/>
      <stop offset="1" stop-color="#0c0a1f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.55" stop-color="#ff6b3d"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a6e"/>
      <stop offset="1" stop-color="#1c1440"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sunclip"><circle cx="128" cy="118" r="78"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- striped synthwave sun -->
  <g clip-path="url(#sunclip)">
    <rect x="40" y="36" width="176" height="170" fill="url(#sun)"/>
    <rect x="40" y="128" width="176" height="6" fill="#2a1150"/>
    <rect x="40" y="146" width="176" height="8" fill="#2a1150"/>
    <rect x="40" y="166" width="176" height="10" fill="#2a1150"/>
    <rect x="40" y="188" width="176" height="12" fill="#2a1150"/>
  </g>
  <!-- horizon grid -->
  <g stroke="#2bd2ff" stroke-width="3" opacity="0.55" fill="none">
    <path d="M24 206 H232"/>
    <path d="M128 206 L128 240 M96 206 L76 240 M160 206 L180 240 M64 206 L28 240 M192 206 L228 240"/>
  </g>
  <!-- cartridge -->
  <g filter="url(#glow)">
    <path d="M70 92 H170 L186 108 V214 H70 Z" fill="url(#cart)" stroke="#2bd2ff" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <rect x="86" y="112" width="84" height="56" rx="8" fill="#f4f1ff"/>
  <!-- down arrow (scrape) on the label -->
  <path d="M128 118 V150 M112 136 L128 152 L144 136" fill="none" stroke="#ff2e88" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2bd2ff">
    <rect x="86" y="186" width="10" height="18" rx="2"/>
    <rect x="104" y="186" width="10" height="18" rx="2"/>
    <rect x="122" y="186" width="10" height="18" rx="2"/>
    <rect x="140" y="186" width="10" height="18" rx="2"/>
    <rect x="158" y="186" width="10" height="18" rx="2"/>
  </g>
</svg>
